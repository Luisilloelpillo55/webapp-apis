name: CI/CD WebApp
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p data backups
      - run: npm ci
      - env:
          NODE_ENV: test
        run: npm run test:coverage

  docker:
    name: Construir y publicar Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Iniciar sesion en Docker Hub (con reintentos)
        run: |
          for i in 1 2 3; do
            echo "Intento $i login..."
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin && echo "Login OK" && break
            echo "Fallo, esperando 20s..."
            sleep 20
          done
          docker info
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

  deploy:
    name: Desplegar en EC2
    needs: docker
    runs-on: ubuntu-22.04
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            docker pull ${{ secrets.DOCKER_USERNAME }}/webapp:latest &&
            docker stop webapp-container || true &&
            docker rm webapp-container || true &&
            docker run -d --name webapp-container --restart unless-stopped -p 80:80 -p 6061:6061 ${{ secrets.DOCKER_USERNAME }}/webapp:latest &&
            docker ps
          "